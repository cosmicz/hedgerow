<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hedgerow | Live protection</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header><a class="brand" href="/" aria-label="Hedgerow home"><span class="hedge" aria-hidden="true">⌂</span> Hedgerow</a><span class="mode">Live demo</span></header>
<main>
  <div class="incident-workspace">
    <section id="live-logs" aria-labelledby="logs-title">
      <h1 id="logs-title">Live device logs</h1>
      <p id="log-status" role="status">Connecting…</p>
      <div id="incident-groups" aria-label="Detected incidents"></div>
      <div class="log-scroll"><table class="log-table"><thead><tr><th>Time</th><th>Device</th><th>Domain</th><th>Result</th></tr></thead><tbody id="captured-rows"></tbody></table></div>
      <div class="controls"><button data-command="observe">Generate test traffic</button><button class="secondary" data-command="classify">Analyze now</button></div>
    </section>
    <section class="agent-chat" aria-labelledby="incident-title">
      <h2 id="incident-title">Hedgerow agent</h2>
      <p id="message" role="status" aria-live="polite">Watching for incidents.</p>
      <div id="evidence"></div><div id="judgments"></div>
      <div id="chat-messages" role="log" aria-live="polite"></div>
      <section id="approval" aria-label="Proposed response"></section>
      <section id="verification" aria-label="Verification"></section>
      <details><summary>Execution details</summary><section id="interpretation" aria-label="Agent response"></section></details>
      <form id="chat-form"><label for="chat-input" class="sr-only">Message Hedgerow</label><textarea id="chat-input" maxlength="1000" rows="2" placeholder="What happened? What should I do?"></textarea><button type="submit">Send</button></form>
      <button class="secondary" data-command="propose">Review response</button>
      <details id="response-history"><summary>Agent activity</summary><ol id="activity-rows"></ol></details>
      <details><summary>Evidence timeline</summary><ol id="timeline"></ol></details>
    </section>
  </div>
  <details class="router-panel"><summary id="router-title">Router security</summary><div id="router"></div></details>
  <section id="guidance" aria-label="Reference guidance"></section>
  <details><summary id="sponsors-title">Connected services</summary><div id="sponsors"></div></details>
  <details><summary>Technical details</summary><pre id="raw"></pre></details>
  <button class="secondary" data-command="reset">Reset demo view</button>
</main></body></html>
